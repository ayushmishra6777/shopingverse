<!DOCTYPE html>
<html>
<head>
    <title>ShopVerse - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            margin: 0;
            padding: 80px 0;
        }

        .form-container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            width: 400px;
            margin: 0 auto;
        }

        h2 {
            color: #d97706;
            margin: 0;
            text-align: center;
        }

        h3 {
            color: #334155;
            margin-top: 5px;
            text-align: center;
        }

        hr {
            border: 1px solid #e2e8f0;
            margin: 20px 0;
        }

        label {
            font-weight: bold;
            color: #1e293b;
            font-size: 14px;
        }

        input {
            width: 95%;
            padding: 9px;
            margin-top: 5px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }

        button {
            background-color: #059669;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #047857;
        }

        footer {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-top: 20px;
        }

        a {
            color: #d97706;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>ShopVerse</h2>
        <h3>Customer Login</h3>
        <hr>

        <form onsubmit="return validateLogin(event)">
            <label>Email Address :</label><br>
            <input type="email" id="loginEmail" placeholder="Enter Registered Email" required><br><br>

            <label>Password :</label><br>
            <input type="password" id="loginPassword" placeholder="Enter Password" required><br><br>

            <button type="submit">Login to Store</button>
        </form>

        <hr>
        <footer>
            <p>New to ShopVerse? <a href="register.html">Create an account</a></p>
        </footer>
    </div>

    <script>
        async function validateLogin(event) {
            if (event) event.preventDefault();

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (result.success) {
                    alert("Login Successful! Welcome to ShopVerse.");
                    
                    sessionStorage.setItem("custName", result.customer.name);
                    sessionStorage.setItem("custEmail", result.customer.email);
                    sessionStorage.setItem("custCity", result.customer.city);
                    sessionStorage.setItem("custCategory", result.customer.categoryPref);

                    window.location.href = "dashboard.html";
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Could not connect to the server.");
            }

            return false;
        }
    </script>

</body>
</html>
